<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .cart-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            flex-wrap: wrap;
        }
        .cart-item img {
            max-width: 100px;
            height: auto;
            margin-right: 20px;
        }
        .remove-btn, .buy-btn, .clear-cart-btn {
            margin-left: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove-btn {
            background: #ff4d4d;
            color: white;
        }
        .remove-btn:hover {
            background: #ff1a1a;
        }
        .buy-btn {
            background: #4CAF50;
            color: white;
        }
        .buy-btn:hover {
            background: #45a049;
        }
        .clear-cart-btn {
            background: #ff6600;
            color: white;
            margin-top: 15px;
        }
        .clear-cart-btn:hover {
            background: #cc5200;
        }
        .total-price {
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Webtoons</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center">Your Cart</h1>
        <div id="cart-items" class="mt-4"></div>
        <div class="text-center mt-4">
            <p class="total-price">Total Price: <span id="total-price">0</span></p>
            <button class="btn clear-cart-btn" onclick="clearCart()">Clear Cart</button>
            <a href="product.html" class="btn btn-warning">Go Back to List of Webtoons</a>
        </div>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const displayCart = () => {
            const cartItemsContainer = document.getElementById("cart-items");
            const totalPriceContainer = document.getElementById("total-price");
            cartItemsContainer.innerHTML = "";
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
                totalPriceContainer.textContent = "0";
                return;
            }
            let totalPrice = 0;
            cart.forEach((item, index) => {
                totalPrice += parseFloat(item.price.replace(/[^0-9.]/g, ""));
                const cartItem = document.createElement("div");
                cartItem.className = "cart-item";
                cartItem.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-details">
                        <p><strong>${item.name}</strong></p>
                        <p>${item.description}</p>
                        <p>Price: ${item.price}</p>
                    </div>
                    <div>
                        <button class="buy-btn" onclick="buyNow('${item.name}')">Buy Now</button>
                        <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                    </div>
                `;
                cartItemsContainer.appendChild(cartItem);
            });
            totalPriceContainer.textContent = `$${totalPrice.toFixed(2)}`;
        };

        const removeFromCart = (index) => {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        };

        const clearCart = () => {
            if (confirm("Are you sure you want to clear your cart?")) {
                cart = [];
                localStorage.setItem("cart", JSON.stringify(cart));
                displayCart();
            }
        };

        const buyNow = (itemName) => {
            alert(`Redirecting to checkout for ${itemName}...`);
            window.location.href = "checkout.html"; // Replace with actual checkout page
        };

        displayCart();
    </script>
</body>
</html>
